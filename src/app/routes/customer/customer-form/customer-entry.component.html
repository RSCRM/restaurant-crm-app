<div class="customer-entry">
  <nz-card>
    @if (step === 'PHONE') {
      <h2 class="entry-title">Nhập số điện thoại</h2>
      <p class="entry-hint">Nhập số điện thoại để bắt đầu gọi món tại {{ branchName || 'nhà hàng' }}.</p>
      <input
        nz-input
        class="entry-input"
        nzSize="large"
        inputmode="tel"
        autocomplete="tel"
        placeholder="Ví dụ: 0901234567"
        [(ngModel)]="phone"
        (keyup.enter)="submitPhone()"
      />
      <button nz-button class="entry-gap" nzType="primary" nzBlock nzSize="large" [nzLoading]="loading" (click)="submitPhone()">
        Tiếp tục
      </button>
    } @else {
      <h2 class="entry-title">Nhập mã OTP</h2>
      <p class="entry-hint">Mã xác thực đã được gửi tới {{ maskedPhone }}.</p>
      <input
        nz-input
        class="entry-input"
        nzSize="large"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="Nhập 6 số"
        [(ngModel)]="otp"
        [disabled]="otpLocked"
        (keyup.enter)="submitOtp()"
      />
      <button
        nz-button
        class="entry-gap"
        nzType="primary"
        nzBlock
        nzSize="large"
        [nzLoading]="loading"
        [disabled]="otpLocked"
        (click)="submitOtp()"
      >
        Xác thực & gọi món
      </button>
      <button
        nz-button
        class="entry-gap"
        nzType="default"
        nzBlock
        nzSize="large"
        [disabled]="resendSeconds > 0 || otpLocked"
        (click)="resend()"
      >
        @if (resendSeconds > 0) {
          Gửi lại mã sau {{ resendSeconds }}s
        } @else {
          Gửi lại mã
        }
      </button>
      <button nz-button class="entry-link" nzType="link" nzBlock (click)="backToPhone()">Đổi số điện thoại</button>
    }
  </nz-card>
</div>
