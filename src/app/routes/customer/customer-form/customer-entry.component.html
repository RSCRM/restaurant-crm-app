    <div class="customer-entry-container" style="max-width: 400px; margin: 40px auto; padding: 24px;">
      <h2>Chào mừng quý khách! 👋</h2>
      <p>Vui lòng nhập số điện thoại để bắt đầu gọi món</p>

      <!-- BƯỚC 1: NHẬP SĐT -->
      @if (step === 'ENTER_PHONE') {
        <div style="margin-bottom: 16px;">
          <input nz-input [(ngModel)]="phone" placeholder="Số điện thoại (vd: 0901234567)" size="large" />
        </div>
        <button nz-button nzType="primary" nzBlock size="large" [nzLoading]="loading" (click)="onCheckPhone()">
          Tiếp tục
        </button>
      }

      <!-- BƯỚC 2: BẮT NHẬP OTP (CHỈ KHI SĐT CHƯA TỒN TẠI) -->
      @if (step === 'ENTER_OTP') {
        <div style="margin-bottom: 16px;">
          <p style="color: #fa8c16;">SĐT mới! Vui lòng nhập mã OTP đã gửi đến {{ phone }}:</p>
          <input nz-input [(ngModel)]="otp" placeholder="Nhập 6 số OTP" size="large" />
        </div>
        <button nz-button nzType="primary" nzBlock size="large" [nzLoading]="loading" (click)="onVerifyOtp()">
          Xác thực & Gọi món
        </button>
        <button nz-button nzType="link" nzBlock (click)="step = 'ENTER_PHONE'" style="margin-top: 8px;">
          Đổi SĐT khác
        </button>
      }
    </div>
