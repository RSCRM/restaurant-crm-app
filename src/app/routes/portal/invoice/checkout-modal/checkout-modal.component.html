<div style="padding: 8px 0;">
  <!-- Order ID -->
  <div style="margin-bottom: 16px;">
    <label style="display: block; margin-bottom: 4px; font-weight: 500;">Mã Đơn Hàng (Order ID) <span style="color: red;">*</span></label>
    <input nz-input [(ngModel)]="orderId" placeholder="Nhập Order ID cần thanh toán" nzSize="large" />
  </div>

  <!-- Payment Method -->
  <div style="margin-bottom: 16px;">
    <label style="display: block; margin-bottom: 4px; font-weight: 500;">Phương thức thanh toán <span style="color: red;">*</span></label>
    <nz-select [(ngModel)]="paymentMethod" nzSize="large" style="width: 100%;">
      @for (method of paymentMethods; track method.value) {
        <nz-option [nzValue]="method.value" [nzLabel]="method.label"></nz-option>
      }
    </nz-select>
  </div>

  <nz-divider nzText="🎫 Áp dụng Voucher (uc-scr-ui-03)" nzOrientation="left"></nz-divider>

  <!-- Voucher Code -->
  <div style="margin-bottom: 16px;">
    <label style="display: block; margin-bottom: 4px; font-weight: 500;">Mã Voucher (tùy chọn)</label>
    <input nz-input [(ngModel)]="voucherCode" placeholder="Nhập mã voucher giảm giá nếu có" />
  </div>

  <nz-divider nzText="🏆 Trừ điểm thành viên (uc-scr-ui-04)" nzOrientation="left"></nz-divider>

  <!-- Loyalty Points -->
  <div style="margin-bottom: 16px;">
    <label style="display: block; margin-bottom: 4px; font-weight: 500;">SĐT Khách hàng thành viên (tùy chọn)</label>
    <input nz-input [(ngModel)]="loyaltyPhone" placeholder="Nhập SĐT để tra cứu điểm tích lũy" />
  </div>
  <div style="margin-bottom: 16px;">
    <label style="display: block; margin-bottom: 4px; font-weight: 500;">Số điểm muốn đổi</label>
    <input nz-input [(ngModel)]="loyaltyPoints" type="number" placeholder="Nhập số điểm cần trừ" />
  </div>

  <nz-divider></nz-divider>

  <!-- Note -->
  <div style="margin-bottom: 16px;">
    <label style="display: block; margin-bottom: 4px; font-weight: 500;">Ghi chú</label>
    <textarea nz-input [(ngModel)]="note" placeholder="Ghi chú hóa đơn (tùy chọn)" [nzAutosize]="{ minRows: 2, maxRows: 4 }"></textarea>
  </div>

  <!-- Actions -->
  <div style="display: flex; justify-content: flex-end; gap: 8px;">
    <button nz-button nzType="default" (click)="onCancel()">Hủy</button>
    <button nz-button nzType="primary" nzSize="large" [nzLoading]="loading" (click)="onCheckout()">
      <span nz-icon nzType="check-circle"></span>
      Xác nhận Thanh Toán
    </button>
  </div>
</div>
