<div class="branch-form-header">
  <h2>{{ (isEdit ? 'branch.form.editTitle' : 'branch.form.createTitle') | i18n }}</h2>
</div>

<form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">
  <nz-form-item>
    <nz-form-label nzRequired>{{ 'branch.branchName' | i18n }}</nz-form-label>
    <nz-form-control [nzErrorTip]="'branch.validation.branchNameRequired' | i18n">
      <input nz-input formControlName="branchName" [placeholder]="'branch.placeholders.branchName' | i18n" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label>{{ 'branch.branchAddress' | i18n }}</nz-form-label>
    <nz-form-control>
      <input nz-input formControlName="address" [placeholder]="'branch.placeholders.address' | i18n" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label>{{ 'branch.branchPhone' | i18n }}</nz-form-label>
    <nz-form-control>
      <input nz-input formControlName="phone" [placeholder]="'branch.placeholders.phone' | i18n" />
    </nz-form-control>
  </nz-form-item>

  @if (isEdit) {
    <nz-form-item>
      <nz-form-label nzRequired>{{ 'branch.status.title' | i18n }}</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="status">
          @for (status of statuses; track status) {
            <nz-option [nzValue]="status" [nzLabel]="'branch.status.' + status.toLowerCase() | i18n" />
          }
        </nz-select>
      </nz-form-control>
    </nz-form-item>
  }

  <div class="branch-form-actions">
    <button nz-button type="button" (click)="close()" [disabled]="submitting">{{ 'common.cancel' | i18n }}</button>
    <button nz-button nzType="primary" type="submit" [nzLoading]="submitting" [disabled]="form.invalid || submitting">
      {{ 'common.submit' | i18n }}
    </button>
  </div>
</form>
