<page-header [title]="'Chọn tổ chức'" />
<nz-card>
  <p nz-typography class="context-subtitle">Vui lòng chọn tổ chức để tiếp tục sử dụng hệ thống</p>

  <nz-spin [nzSpinning]="loading$ | async">
    <div class="context-grid">
      @for (ctx of contexts$ | async; track ctx.organizationId) {
        <div class="context-item">
          <nz-card [nzTitle]="ctx.organizationName" nzHoverable>
            @if (ctx.branchName) {
              <p><strong>Chi nhánh:</strong> {{ ctx.branchName }}</p>
            }
            <div style="margin-bottom: 12px;">
              <nz-tag nzColor="blue">{{ ctx.role }}</nz-tag>
            </div>
            <button nz-button nzType="primary" nzBlock (click)="selectContext(ctx)" [nzLoading]="loading$ | async">
              <span nz-icon nzType="check-circle" nzTheme="outline"></span>
              Chọn
            </button>
          </nz-card>
        </div>
      }
    </div>
  </nz-spin>
</nz-card>
