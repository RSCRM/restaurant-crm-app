<page-header [title]="'app.context-select.title' | i18n" />
<nz-card>
  <p nz-typography class="context-subtitle">{{ 'app.context-select.subtitle' | i18n }}</p>

  <nz-spin [nzSpinning]="loading$ | async">
    <div class="context-grid">
      @for (ctx of contexts$ | async; track ctx.employeeId ?? ctx.branchId ?? ctx.organizationId) {
        <div class="context-item">
          <nz-card [nzTitle]="ctx.organizationName" nzHoverable>
            @if (ctx.branchName) {
              <p
                ><strong>{{ 'app.context-select.branch' | i18n }}:</strong> {{ ctx.branchName }}</p
              >
            }
            <div class="context-role">
              <nz-tag nzColor="blue">{{ ctx.role }}</nz-tag>
            </div>
            <button nz-button nzType="primary" nzBlock (click)="selectContext(ctx)" [nzLoading]="loading$ | async">
              <span nz-icon nzType="check-circle" nzTheme="outline"></span>
              {{ 'app.context-select.select' | i18n }}
            </button>
          </nz-card>
        </div>
      }
    </div>
  </nz-spin>
</nz-card>
