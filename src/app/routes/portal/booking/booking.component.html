<page-header [title]="'Quản lý Đặt bàn'" />

<nz-card>
  <!-- Search/Filter Controls -->
  <div style="margin-bottom: 20px;">
    <form nz-form [nzLayout]="'inline'">
      <!-- SĐT Search -->
      <nz-form-item style="margin-right: 16px;">
        <nz-form-control>
          <nz-input-group nzPrefixIcon="phone">
            <input nz-input [(ngModel)]="searchPhone" name="searchPhone" placeholder="Tìm theo SĐT khách..." style="width: 200px;" (keyup.enter)="search()" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <!-- Status Selection -->
      <nz-form-item style="margin-right: 16px;">
        <nz-form-label>Trạng thái</nz-form-label>
        <nz-form-control>
          <nz-select [(ngModel)]="filterStatus" name="filterStatus" style="width: 150px;" (ngModelChange)="filterData()">
            <nz-option nzValue="ALL" nzLabel="Tất cả"></nz-option>
            <nz-option nzValue="PENDING" nzLabel="Chờ phục vụ (Pending)"></nz-option>
            <nz-option nzValue="CONFIRMED" nzLabel="Đã xác nhận (Confirmed)"></nz-option>
            <nz-option nzValue="SEATED" nzLabel="Đã nhận bàn (Seated)"></nz-option>
            <nz-option nzValue="CANCELLED" nzLabel="Đã hủy (Cancelled)"></nz-option>
            <nz-option nzValue="EXPIRED" nzLabel="Hết hạn (Expired)"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <!-- Search / Reset Buttons -->
      <nz-form-item>
        <button nz-button nzType="primary" (click)="search()">
          <span nz-icon nzType="search"></span>Tìm kiếm
        </button>
        <button nz-button nzType="default" (click)="reset()" style="margin-left: 8px;">
          Làm mới
        </button>
      </nz-form-item>

      <!-- Add Booking Button (Protected by local permission check) -->
      <div style="margin-left: auto; display: flex; align-items: center;">
        <button *ngIf="hasCreatePermission" nz-button nzType="primary" (click)="openCreateBooking()">
          <span nz-icon nzType="plus"></span>Tạo Đặt Bàn
        </button>
      </div>
    </form>
  </div>

  <!-- Delon ST Table -->
  <st
    #st
    [columns]="columns"
    [data]="displayBookings"
    [total]="total"
    [ps]="pageSize"
    [pi]="currentPage"
    [loading]="loading"
    [page]="{ show: true, showSize: true }"
    [scroll]="{ x: '1100px' }"
    (change)="onSTChange($event)"
  >
    <!-- Custom render for bookingTime column (with real-time countdown) -->
    <ng-template st-row="bookingTime" let-item>
      <div style="font-weight: 500;">{{ item.bookingTime | date:'yyyy-MM-dd HH:mm' }}</div>
      <ng-container [ngSwitch]="getCountdownInfo(item).type">
        <span *ngSwitchCase="'countdown'" class="countdown-active">
          <span nz-icon nzType="clock-circle" nzTheme="outline" style="margin-right: 4px;"></span>
          {{ getCountdownInfo(item).text }}
        </span>
        <span *ngSwitchCase="'overdue'" class="overdue-pulse">
          <span nz-icon nzType="warning" nzTheme="outline" style="margin-right: 4px;"></span>
          {{ getCountdownInfo(item).text }}
        </span>
      </ng-container>
    </ng-template>

    <!-- Custom render for Status column -->
    <ng-template st-row="status" let-item>
      <nz-tag [nzColor]="item.status === 'CONFIRMED' ? 'success' : item.status === 'SEATED' ? 'purple' : item.status === 'CANCELLED' ? 'error' : item.status === 'EXPIRED' ? 'default' : 'processing'">
        {{ item.status }}
      </nz-tag>
    </ng-template>

    <!-- Custom render for Actions column -->
    <ng-template st-row="actions" let-item>
      <!-- Control buttons -->
      <div style="display: flex; gap: 8px; align-items: center;">
        <!-- Nhận bàn (Seated) -->
        <button
          *ngIf="item.status === 'CONFIRMED' || item.status === 'PENDING'"
          nz-button
          nzType="primary"
          nzSize="small"
          (click)="updateStatus(item, bookingStatus.SEATED)"
        >
          Nhận bàn
        </button>

        <!-- Hủy đặt bàn (Cancel) -->
        <ng-container *ngIf="hasUpdatePermission">
          <button
            *ngIf="item.status === 'CONFIRMED' || item.status === 'PENDING'"
            nz-button
            nzType="default"
            nzDanger
            nzSize="small"
            (click)="updateStatus(item, bookingStatus.CANCELLED)"
          >
            Hủy đặt
          </button>
        </ng-container>
      </div>
    </ng-template>
  </st>
</nz-card>
