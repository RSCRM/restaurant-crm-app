<div class="modal-header">
  <div class="modal-title">{{ 'app.employee.form.roleTitle' | i18n }}</div>
</div>

@if (errorText) {
  <nz-alert nzType="error" [nzMessage]="errorText" nzShowIcon class="form-alert" />
}

<form nz-form [formGroup]="form" (ngSubmit)="submit()" nzLayout="vertical">
  <nz-form-item>
    <nz-form-label [nzRequired]="true">{{ 'app.employee.form.orgRole' | i18n }}</nz-form-label>
    <nz-form-control>
      <nz-select formControlName="orgRoleId" [nzPlaceHolder]="'app.employee.form.orgRolePlaceholder' | i18n">
        @for (role of roles; track role.id) {
          <nz-option [nzValue]="role.id" [nzLabel]="role.roleName" />
        }
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <div class="modal-footer">
    <button nz-button type="button" (click)="close()">{{ 'app.employee.form.cancel' | i18n }}</button>
    <button nz-button type="submit" nzType="primary" [nzLoading]="loading" [disabled]="form.invalid">
      {{ 'app.employee.form.submit' | i18n }}
    </button>
  </div>
</form>
