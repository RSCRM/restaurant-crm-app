<div class="employee-selection">
  <div class="employee-selection-toolbar">
    <nz-input-group nzPrefixIcon="search">
      <input
        nz-input
        [(ngModel)]="keyword"
        [placeholder]="'employee.placeholders.search' | i18n"
        (ngModelChange)="onKeywordChange($event)"
        (keyup.enter)="search()"
      />
    </nz-input-group>

    <nz-select [(ngModel)]="role" [nzPlaceHolder]="'employee.filters.role' | i18n" (ngModelChange)="search()">
      <nz-option [nzValue]="null" [nzLabel]="'employee.filters.allRoles' | i18n"></nz-option>
      @for (item of roles; track item) {
        <nz-option [nzValue]="item" [nzLabel]="item"></nz-option>
      }
    </nz-select>

    <nz-select [(ngModel)]="status" [nzPlaceHolder]="'employee.filters.status' | i18n" (ngModelChange)="search()">
      <nz-option [nzValue]="null" [nzLabel]="'employee.filters.allStatuses' | i18n"></nz-option>
      @for (item of statuses; track item) {
        <nz-option [nzValue]="item" [nzLabel]="('employee.status.' + item.toLowerCase()) | i18n"></nz-option>
      }
    </nz-select>

    <button nz-button nzType="primary" type="button" (click)="search()">
      <span nz-icon nzType="search" nzTheme="outline"></span>
      {{ 'employee.actions.search' | i18n }}
    </button>
    <button nz-button type="button" (click)="reset()">{{ 'employee.actions.reset' | i18n }}</button>
  </div>

  <st
    [columns]="columns"
    [data]="data"
    [total]="total"
    [ps]="pageSize"
    [pi]="currentPage"
    [loading]="loading"
    [page]="{ show: true, showSize: true }"
    [scroll]="{ x: '860px' }"
    (change)="onSTChange($event)"
  >
    <ng-template st-row="employeeId" let-item>
      {{ item.employeeCode || item.employeeId || item.id }}
    </ng-template>

    <ng-template st-row="identity" let-item>
      <strong>{{ item.fullName || item.username || ('common.emptyValue' | i18n) }}</strong>
      <div class="employee-selection-subtext">{{ item.email || ('common.emptyValue' | i18n) }}</div>
    </ng-template>

    <ng-template st-row="role" let-item>
      <app-employee-role-badge [role]="item.orgRoleName || item.role" />
    </ng-template>

    <ng-template st-row="status" let-item>
      <app-employee-status-badge [status]="item.status" />
    </ng-template>

    <ng-template st-row="actions" let-item>
      <button nz-button nzType="link" type="button" (click)="select(item)">{{ 'employee.actions.select' | i18n }}</button>
    </ng-template>
  </st>

  @if (!loading && data.length === 0) {
    <nz-empty [nzNotFoundContent]="'employee.empty' | i18n" />
  }

  <div class="employee-selection-actions">
    <button nz-button type="button" (click)="close()">{{ 'common.cancel' | i18n }}</button>
  </div>
</div>
