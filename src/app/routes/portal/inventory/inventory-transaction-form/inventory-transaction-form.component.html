<nz-spin [nzSpinning]="loading">
  <div style="padding: 16px">
    <h3 style="margin-bottom: 20px; font-weight: bold; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px">
      Tạo Giao Dịch Tồn Kho Mới
    </h3>

    <form nz-form [formGroup]="form" (ngSubmit)="submit()">
      <div nz-row [nzGutter]="16">
        <!-- Inventory -->
        <div nz-col nzSpan="12">
          <nz-form-item>
            <nz-form-label nzRequired [nzSpan]="24">Tồn Kho</nz-form-label>
            <nz-form-control nzErrorTip="Vui lòng chọn tồn kho">
              <nz-select formControlName="inventoryId" nzPlaceHolder="Chọn tồn kho...">
                @for (inv of inventories; track inv.id) {
                  <nz-option [nzValue]="inv.id" [nzLabel]="inv.ingredientName" />
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Transaction Type -->
        <div nz-col nzSpan="12">
          <nz-form-item>
            <nz-form-label nzRequired [nzSpan]="24">Loại Giao Dịch</nz-form-label>
            <nz-form-control nzErrorTip="Vui lòng chọn loại giao dịch">
              <nz-select formControlName="transactionType" nzPlaceHolder="Chọn loại...">
                @for (type of transactionTypes; track type) {
                  <nz-option [nzValue]="type" [nzLabel]="getTransactionTypeLabel(type)" />
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>

      <div nz-row [nzGutter]="16">
        <!-- Transaction Direction -->
        <div nz-col nzSpan="12">
          <nz-form-item>
            <nz-form-label nzRequired [nzSpan]="24">Hướng Giao Dịch</nz-form-label>
            <nz-form-control nzErrorTip="Vui lòng chọn hướng giao dịch">
              <nz-select formControlName="transactionDirection" nzPlaceHolder="Chọn hướng...">
                @for (dir of transactionDirections; track dir) {
                  <nz-option [nzValue]="dir" [nzLabel]="getDirectionLabel(dir)" />
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Quantity -->
        <div nz-col nzSpan="12">
          <nz-form-item>
            <nz-form-label nzRequired [nzSpan]="24">Số Lượng</nz-form-label>
            <nz-form-control nzErrorTip="Vui lòng nhập số lượng (> 0)">
              <nz-input-number formControlName="quantity" [nzMin]="0.1" [nzStep]="0.1" style="width: 100%" />
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>

      <!-- Employee ID (optional) -->
      <nz-form-item>
        <nz-form-label [nzSpan]="24">ID Nhân Viên (Tùy chọn)</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="employeeId" placeholder="Nhập ID nhân viên (nếu có)..." />
        </nz-form-control>
      </nz-form-item>

      <!-- Note -->
      <nz-form-item>
        <nz-form-label [nzSpan]="24">Ghi Chú</nz-form-label>
        <nz-form-control>
          <textarea nz-input formControlName="note" rows="3" placeholder="Nhập ghi chú giao dịch (tùy chọn)..."></textarea>
        </nz-form-control>
      </nz-form-item>

      <!-- Actions -->
      <div style="margin-top: 24px; text-align: right">
        <button nz-button nzType="default" type="button" (click)="cancel()" [disabled]="submitting" style="margin-right: 8px">
          Hủy
        </button>
        <button nz-button nzType="primary" type="submit" [nzLoading]="submitting" [disabled]="form.invalid">
          Tạo Giao Dịch
        </button>
      </div>
    </form>
  </div>
</nz-spin>
