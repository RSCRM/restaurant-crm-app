<page-header [title]="'app.inventory.category.title' | i18n" />

<nz-card>
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <nz-input-group [nzPrefix]="prefixSearch" style="width: 280px">
        <input
          nz-input
          [(ngModel)]="searchKeyword"
          [placeholder]="'app.inventory.category.searchPlaceholder' | i18n"
          (keyup.enter)="search()"
        />
      </nz-input-group>

      <ng-template #prefixSearch>
        <span nz-icon nzType="search"></span>
      </ng-template>

      <button nz-button nzType="primary" (click)="search()">
        <span nz-icon nzType="search"></span>
        {{ 'app.inventory.category.search' | i18n }}
      </button>

      <button nz-button (click)="reset()">
        <span nz-icon nzType="reload"></span>
        {{ 'app.inventory.category.reset' | i18n }}
      </button>
    </div>

    <button nz-button nzType="primary" (click)="openCreate()">
      <span nz-icon nzType="plus"></span>
      {{ 'app.inventory.category.create' | i18n }}
    </button>
  </div>


  <!-- Category Table -->
  <st
    #st
    [columns]="columns"
    [data]="categories"
    [loading]="loading"
    [total]="total"
    [ps]="pageSize"
    [pi]="currentPage"
    [page]="{
    show: true,
    showSize: true,
    front: false
  }"
    [scroll]="{ x: '900px' }"
    (change)="onSTChange($event)"
  >
    <ng-template st-row="status" let-item>
      <nz-tag [nzColor]="getCategoryStatusColor(item.status)">
        {{
          item.status === inventoryCategoryStatus.ACTIVE
            ? ('app.inventory.category.status.active' | i18n)
            : ('app.inventory.category.status.inactive' | i18n)
        }}
      </nz-tag>
    </ng-template>
    <ng-template st-row="statusSwitch" let-item>
  <span
    class="switch-wrapper"
    (click)="confirmToggle(item)"
  >
    <nz-switch
      [ngModel]="item.status === inventoryCategoryStatus.ACTIVE"
      class="status-switch">
    </nz-switch>
  </span>
    </ng-template>
  </st>
</nz-card>
