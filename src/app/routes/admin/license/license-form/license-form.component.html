<div class="modal-header">
  <div class="modal-title">{{ isEdit ? 'Cập nhật License' : 'Tạo License' }}</div>
</div>
<form nz-form [formGroup]="form" (ngSubmit)="submit()" nzLayout="vertical">
  <nz-form-item>
    <nz-form-label [nzRequired]="!isEdit">Mã License</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng nhập mã license (tối đa 50 ký tự)">
      <input nz-input formControlName="code" placeholder="VD: BASIC, PRO, ENTERPRISE" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzRequired]="!isEdit">Tên License</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng nhập tên license">
      <input nz-input formControlName="name" placeholder="VD: Gói Cơ Bản" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label>Mô tả</nz-form-label>
    <nz-form-control>
      <textarea nz-input formControlName="description" [nzAutosize]="{ minRows: 2, maxRows: 4 }" placeholder="Mô tả về license"></textarea>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzRequired]="true">Giá (VNĐ)</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng nhập giá >= 0">
      <nz-input-number formControlName="price" [nzMin]="0" [nzStep]="1000" [nzFormatter]="formatterCurrency" [nzParser]="parserCurrency" style="width: 100%"></nz-input-number>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzRequired]="true">Chu kỳ thanh toán</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng chọn chu kỳ">
      <nz-select formControlName="billingCycle" nzPlaceHolder="Chọn chu kỳ">
        <nz-option nzValue="MONTHLY" nzLabel="Hàng tháng"></nz-option>
        <nz-option nzValue="YEARLY" nzLabel="Hàng năm"></nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <div style="display: flex; gap: 16px;">
    <nz-form-item style="flex: 1;">
      <nz-form-label [nzRequired]="true">Số chi nhánh tối đa</nz-form-label>
      <nz-form-control nzErrorTip="Nhập -1 cho không giới hạn">
        <nz-input-number formControlName="maxBranch" [nzMin]="-1" style="width: 100%"></nz-input-number>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item style="flex: 1;">
      <nz-form-label [nzRequired]="true">Số nhân viên tối đa</nz-form-label>
      <nz-form-control nzErrorTip="Nhập -1 cho không giới hạn">
        <nz-input-number formControlName="maxEmployee" [nzMin]="-1" style="width: 100%"></nz-input-number>
      </nz-form-control>
    </nz-form-item>
  </div>

  @if (isEdit) {
    <nz-form-item>
      <nz-form-label [nzRequired]="true">Trạng thái</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="status">
          <nz-option nzValue="ACTIVE" nzLabel="Hoạt động"></nz-option>
          <nz-option nzValue="LOCKED" nzLabel="Khóa"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>
  }

  <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
    <button nz-button type="button" (click)="close()">Hủy</button>
    <button nz-button type="submit" [nzType]="'primary'" [nzLoading]="loading" [disabled]="form.invalid">
      {{ isEdit ? 'Cập nhật' : 'Tạo mới' }}
    </button>
  </div>
</form>
